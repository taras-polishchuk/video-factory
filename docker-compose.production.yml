# Production docker-compose for Video Factory SaaS.
#
# Services (one compose network, `vf`):
#   - api   FastAPI (Dockerfile). Listens on 0.0.0.0:8000 inside the
#           network only; no host port.
#   - web   SvelteKit adapter-node server (web/Dockerfile). Listens on
#           0.0.0.0:3000 inside the network only; no host port.
#   - caddy Caddy + Cloudflare DNS module (infra/caddy/Dockerfile). The
#           only public listener: :80 (redirect) and :443 (TLS, DNS-01).
#
# Build + run (normally via systemd/video-factory.service):
#   docker compose -f docker-compose.production.yml --env-file .env.production build
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# .env.production (mode 0600, gitignored) is generated by
# systemd/video-factory-load-env.sh from /etc/video-factory/config.env
# (non-secret: domain, image tag, Caddyfile path) and the systemd
# LoadCredential= files (secrets). No secret literal lives in this file.
#
# Sizing (A2 F-08): Hetzner CX22 = 2 vCPU / 4 GB RAM, no swap.
#   api 2 GB (ffmpeg renders ~0.8 GB each), web 384 MB, caddy 256 MB:
#   ~2.6 GB for containers, the rest for the OS, dockerd and page cache.

name: video-factory

x-hardening: &hardening
  restart: unless-stopped
  init: true
  # A2 F-08: no privilege escalation, no Linux capabilities, read-only
  # root filesystem. Writable paths are explicit volumes / tmpfs below.
  read_only: true
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  # A2 F-21: bounded json-file logs (5 x 10 MB per container).
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  networks:
    - vf

services:
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    image: video-factory-api:${VIDEO_FACTORY_IMAGE_TAG:-dev}
    environment:
      VIDEO_FACTORY_DB: /data/video_factory.db
      VIDEO_FACTORY_STORAGE: /data/storage
      # ffmpeg temp files go to the data volume, not to a RAM-backed tmpfs.
      TMPDIR: /data/tmp
      # A2 F-05 / F-18: production mode, Secure cookies, public base URL
      # for Stripe success/cancel and OIDC redirect URLs.
      VIDEO_FACTORY_ENV: production
      VF_HTTPS: "1"
      VIDEO_FACTORY_PUBLIC_BASE_URL: https://${VIDEO_FACTORY_DOMAIN:?VIDEO_FACTORY_DOMAIN must be set}
      # uvicorn --proxy-headers trusts X-Forwarded-* only from the compose
      # network (Caddy). Keep in sync with networks.vf below.
      FORWARDED_ALLOW_IPS: ${VF_NET_SUBNET:-172.31.250.0/24}
      # Secrets (from .env.production, never from this file)
      VIDEO_FACTORY_SECRET_KEY: ${VIDEO_FACTORY_SECRET_KEY:?VIDEO_FACTORY_SECRET_KEY must be set}
      VIDEO_FACTORY_DB_KEY: ${VIDEO_FACTORY_DB_KEY:?VIDEO_FACTORY_DB_KEY must be set}
      VIDEO_FACTORY_SESSION_SECRET: ${VIDEO_FACTORY_SESSION_SECRET:?VIDEO_FACTORY_SESSION_SECRET must be set}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY must be set}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set}
      # Observability (docs/observability.md). Empty SENTRY_DSN = Sentry off.
      VIDEO_FACTORY_ENV: production
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      LIVE_PROVIDER_TESTS: "false"
      MAX_COST_PER_VIDEO_USD: "5"
      MAX_COST_PER_BATCH_USD: "20"
      # S1b / A2 F-05: production mode = Secure session cookie and
      # Origin required on the pre-session /auth/* routes; the public
      # origin is the allow-listed one.
      VIDEO_FACTORY_ENV: production
      VIDEO_FACTORY_PUBLIC_BASE_URL: https://${VIDEO_FACTORY_DOMAIN:?VIDEO_FACTORY_DOMAIN must be set}
    volumes:
      - vf_data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    <<: *hardening
    build:
      context: ./web
      dockerfile: Dockerfile
    image: video-factory-web:${VIDEO_FACTORY_IMAGE_TAG:-dev}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # adapter-node: absolute URLs + form-action CSRF origin check.
      ORIGIN: https://${VIDEO_FACTORY_DOMAIN:?VIDEO_FACTORY_DOMAIN must be set}
      # Cookies must be Secure + SameSite=None when behind HTTPS
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "lax"
      # S1b: the SvelteKit server signs its calls to the pre-session
      # /auth/* routes (X-VF-Internal-Token) with the session secret.
      VIDEO_FACTORY_SESSION_SECRET: ${VIDEO_FACTORY_SESSION_SECRET:?VIDEO_FACTORY_SESSION_SECRET must be set}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    <<: *hardening
    build:
      context: ./infra/caddy
      dockerfile: Dockerfile
    image: video-factory-caddy:${VIDEO_FACTORY_IMAGE_TAG:-dev}
    # Runs as root inside the container with every capability dropped
    # except binding :80/:443.
    cap_add:
      - NET_BIND_SERVICE
    ports:
      # 80 only redirects to https; certificates come from DNS-01.
      - "80:80"
      - "443:443"
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be set}
      # Used when the tracked template is mounted as-is.
      VIDEO_FACTORY_DOMAIN: ${VIDEO_FACTORY_DOMAIN:?VIDEO_FACTORY_DOMAIN must be set}
    volumes:
      # Rendered per-domain copy (scripts/render_caddyfile.py), A2 F-33.
      - ${VIDEO_FACTORY_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  vf:
    ipam:
      config:
        - subnet: ${VF_NET_SUBNET:-172.31.250.0/24}

# Volume names are <project>_<name> (project `video-factory` above):
# video-factory_vf_data, video-factory_caddy_data, video-factory_caddy_config.
# scripts/backup.sh reads vf_data through the api container and
# caddy_data through `docker volume inspect` (A2 F-28).
volumes:
  vf_data:
  caddy_data:
  caddy_config:
