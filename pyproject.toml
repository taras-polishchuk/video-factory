[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-factory"
version = "0.1.0"
description = "Production-oriented Video Factory: Control Plane + swappable Render Plane for branded short-form video."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Taras Polishchuk" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema>=4.0",
    # httpx is used by live provider adapters; lazily imported so a
    # missing install does not break the offline path.
    "httpx>=0.27",
    # cryptography is used by the per-company credential vault
    # (control_plane/secret_vault.py). Required for any deployment
    # that accepts operator-supplied secrets via the web UI. Lazy
    # import in offline-only mode.
    # Floor = first release with no known advisory (CI S4, A1 F21);
    # 50.0.0 fixes GHSA-g6cj-pr64-35w5 and the bundled-OpenSSL HIGHs.
    "cryptography>=50.0.0",
    # stripe is the official Python SDK for the Stripe API.
    # Wave 6a uses it for Checkout Session + Customer Portal
    # session creation; Wave 6c will add webhook signature
    # verification.  Pinned >=10 because earlier versions dropped
    # Python 3.11 support.
    "stripe>=10.0",
    # Wave 8 observability: /metrics is served from a dedicated
    # prometheus_client registry (api/observability.py).
    "prometheus-client>=0.20",
    # Sentry error reporting. Imported lazily, only when SENTRY_DSN
    # is set; declared here so the Docker image and `pip install .`
    # can actually honour a configured DSN. Floor excludes the LOW
    # env-var exposure advisory GHSA-g92j-qhmh-64v2 (fixed in 2.8.0).
    "sentry-sdk>=2.8.0",
    # The remaining runtime imports (CI S4, A1 F23). Every third-party
    # module the code imports must be declared here;
    # tests/test_dependency_declarations.py enforces it.
    # HTTP layer: api/main.py, api/auth.py, api/oidc.py. uvicorn is the
    # server (Dockerfile CMD), not imported.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # FastAPI needs it for Form(...) / UploadFile parsing (not imported
    # directly). Floor = first release with no known advisory (A1 F22):
    # HIGH GHSA-pp6c-gr5w-3c5g / GHSA-wp53-j4wj-2cfg / GHSA-5rvq-cxj2-64vf
    # are fixed in 0.0.27 / 0.0.22 / 0.0.30.
    "python-multipart>=0.0.31",
    # auth/__init__.py: Argon2id hashing, bcrypt fallback + verify of
    # existing "bcrypt:" hashes.
    "argon2-cffi>=23.1",
    "bcrypt>=4.0",
    # api/oidc.py: ID token / JWKS verification (replaces authlib, which
    # was declared but never imported). Floor excludes the HS256 empty
    # key HIGH (GHSA-gg9x-qcx2-xmrh, fixed in 1.6.8).
    "joserfc>=1.6.8",
    # core/cipher_db.py: SQLCipher at rest (VIDEO_FACTORY_DB_KEY).
    "sqlcipher3-binary>=0.5",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    # CI and the worker protocol run the suite as `pytest -n 2`.
    "pytest-xdist>=3.5",
]
postprocess = [
    # FFmpeg is the documented postprocessor. The python wrapper is
    # optional; the assembler prefers the system binary when present.
    "Pillow>=12.3.0",
]

[project.scripts]
video-factory = "cli.video_factory:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["control_plane*", "render_plane*", "assembly*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"